name: jscan
description: "Pemindai dokumen Android 100% offline dengan deteksi 4 sudut otomatis, perbaikan perspektif & bayangan, serta alat PDF berbasis Flutter + Rust."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_rust_bridge: ^2.13.0
  freezed_annotation: ^3.1.0
  flutter_riverpod: ^3.5.0
  camera: ^0.12.2
  image_picker: ^1.2.4
  file_picker: ^13.4.1
  pdfx: ^2.11.0
  sqflite: ^2.4.6
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
